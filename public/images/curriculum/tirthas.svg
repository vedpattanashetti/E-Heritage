<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#180e15"/>
      <stop offset="60%" stop-color="#12080f"/>
      <stop offset="100%" stop-color="#080306"/>
    </linearGradient>
    <linearGradient id="indiaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a1e36"/>
      <stop offset="50%" stop-color="#341225"/>
      <stop offset="100%" stop-color="#230a17"/>
    </linearGradient>
    <linearGradient id="riverGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="himalayaSnow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#180e15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="compassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#180e15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="350" fill="url(#mapBg)"/>

  <!-- Subtle Latitude / Longitude Navigation Grid -->
  <g stroke="#d97706" stroke-width="0.7" opacity="0.15">
    <circle cx="300" cy="175" r="140" fill="none" stroke-dasharray="3,4"/>
    <circle cx="300" cy="175" r="90" fill="none" stroke-dasharray="3,4"/>
    <line x1="300" y1="10" x2="300" y2="340"/>
    <line x1="50" y1="175" x2="550" y2="175"/>
    <line x1="80" y1="0" x2="80" y2="350"/>
    <line x1="520" y1="0" x2="520" y2="350"/>
  </g>

  <!-- Himalaya Mountain Range Backing -->
  <path d="M 230 45 L 255 30 L 275 42 L 305 25 L 335 38 L 365 28 L 395 45 L 430 40 L 410 70 L 220 70 Z" fill="url(#himalayaSnow)"/>
  <!-- Mountain ridge lines -->
  <path d="M 230 45 L 255 30 L 275 42 L 305 25 L 335 38 L 365 28 L 395 45 L 420 40" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.7"/>

  <!-- Stylized Peninsula of Bharat (India Map Silhouette) -->
  <path d="
    M 290 35 
    C 310 40, 345 50, 360 65 
    C 385 75, 410 90, 420 115 
    C 425 130, 410 145, 395 155 
    C 380 165, 385 185, 380 205 
    C 375 225, 365 250, 350 275 
    C 335 300, 320 325, 300 338 
    C 285 325, 275 295, 260 270 
    C 245 240, 235 215, 230 190 
    C 225 165, 210 155, 195 140 
    C 180 125, 185 110, 205 100 
    C 225 90, 240 75, 255 55 
    Z" 
    fill="url(#indiaGrad)" stroke="#e5a93b" stroke-width="1.8"/>

  <!-- Sacred Rivers (Flowing blue lines) -->
  <!-- Sindhu / Indus -->
  <path d="M 270 40 Q 240 55 220 90 Q 205 120 195 140" fill="none" stroke="url(#riverGlow)" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Ganga -->
  <path d="M 290 55 Q 320 75 350 95 Q 380 110 410 120" fill="none" stroke="url(#riverGlow)" stroke-width="2.2"/>
  <!-- Yamuna -->
  <path d="M 275 60 Q 300 85 330 100 Q 350 105 380 110" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
  <!-- Narmada -->
  <path d="M 335 150 Q 280 155 225 155" fill="none" stroke="url(#riverGlow)" stroke-width="1.8"/>
  <!-- Godavari -->
  <path d="M 250 180 Q 310 190 375 200" fill="none" stroke="url(#riverGlow)" stroke-width="1.8"/>
  <!-- Kaveri -->
  <path d="M 275 270 Q 310 275 345 280" fill="none" stroke="url(#riverGlow)" stroke-width="1.8"/>

  <!-- The 4 Dhams (Char Dham Cardinal Nodes) -->
  <!-- 1. Badrinath (North) -->
  <circle cx="295" cy="55" r="14" fill="url(#nodePulse)"/>
  <circle cx="295" cy="55" r="4.5" fill="#fef08a" stroke="#fff" stroke-width="1.5"/>
  <text x="295" y="44" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BADRINATH</text>

  <!-- 2. Dwarka (West) -->
  <circle cx="195" cy="140" r="14" fill="url(#nodePulse)"/>
  <circle cx="195" cy="140" r="4.5" fill="#fef08a" stroke="#fff" stroke-width="1.5"/>
  <text x="185" y="144" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="end">DWARKA</text>

  <!-- 3. Puri (East) -->
  <circle cx="400" cy="155" r="14" fill="url(#nodePulse)"/>
  <circle cx="400" cy="155" r="4.5" fill="#fef08a" stroke="#fff" stroke-width="1.5"/>
  <text x="412" y="159" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="start">PURI</text>

  <!-- 4. Rameswaram (South) -->
  <circle cx="312" cy="320" r="14" fill="url(#nodePulse)"/>
  <circle cx="312" cy="320" r="4.5" fill="#fef08a" stroke="#fff" stroke-width="1.5"/>
  <text x="312" y="338" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">RAMESWARAM</text>

  <!-- Pancha Bhoota Sthalas (5 Elements Cluster in South) -->
  <g fill="#38bdf8" stroke="#0c4a6e" stroke-width="1">
    <circle cx="295" cy="275" r="3.5" title="Kanchipuram (Earth)"/>
    <circle cx="290" cy="285" r="3.5" title="Tiruvannamalai (Fire)"/>
    <circle cx="305" cy="290" r="3.5" title="Chidambaram (Space)"/>
    <circle cx="300" cy="255" r="3.5" title="Srikalahasti (Air)"/>
    <circle cx="290" cy="300" r="3.5" title="Thiruvanaikaval (Water)"/>
  </g>
  <text x="210" y="285" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">PANCHA BHOOTA</text>
  <line x1="265" y1="282" x2="286" y2="282" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ornate Sacred Compass Rose (Top Right) -->
  <g transform="translate(490, 75)">
    <circle cx="0" cy="0" r="45" fill="url(#compassGlow)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#d97706" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="2,3"/>
    
    <!-- 8 Compass points -->
    <polygon points="0,-36 4,-8 0,0 -4,-8" fill="#e5a93b"/>
    <polygon points="0,36 4,8 0,0 -4,8" fill="#b45309"/>
    <polygon points="36,0 8,4 0,0 8,-4" fill="#d97706"/>
    <polygon points="-36,0 -8,4 0,0 -8,-4" fill="#92400e"/>
    
    <text x="0" y="-40" fill="#fde047" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">UTTARA (N)</text>
    <text x="0" y="48" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">DAKSHINA (S)</text>
    <text x="44" y="3" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="start">PURVA</text>
    <text x="-44" y="3" fill="#fde047" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="end">PASHCHIMA</text>
  </g>

  <!-- Legend Badge (Bottom Left) -->
  <rect x="25" y="245" width="160" height="85" rx="6" fill="#1b0c16" stroke="#b45309" stroke-width="1"/>
  <text x="35" y="265" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="800">SACRED TIRTHAS</text>
  <circle cx="40" cy="282" r="4" fill="#fde047"/>
  <text x="52" y="285" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">4 Cardinal Dhams</text>
  <circle cx="40" cy="299" r="4" fill="#38bdf8"/>
  <text x="52" y="302" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">5 Elemental Lingams</text>
  <line x1="36" y1="316" x2="46" y2="316" stroke="#38bdf8" stroke-width="2"/>
  <text x="52" y="319" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="9.5">7 Sacred Rivers</text>
</svg>
