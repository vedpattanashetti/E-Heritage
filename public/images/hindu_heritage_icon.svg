<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-label="Hindu Cultural Heritage Emblem" role="img">
  <defs>
    <!-- Rich Golden Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Sacred Diya Flame Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="30%" stop-color="#f97316"/>
      <stop offset="65%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <!-- Medallion Background Gradient -->
    <radialGradient id="discBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3b1220"/>
      <stop offset="75%" stop-color="#240a13"/>
      <stop offset="100%" stop-color="#14040a"/>
    </radialGradient>

    <!-- Soft Golden Aura Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for 3D Relief -->
    <filter id="iconRelief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Outer Beaded Decorative Border -->
  <circle cx="24" cy="24" r="23" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="2 1.5"/>

  <!-- 2. Sacred Velvet Crimson Disc -->
  <circle cx="24" cy="24" r="21.5" fill="url(#discBg)" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- 3. Inner Radiant Aura -->
  <circle cx="24" cy="22" r="16" fill="url(#auraGlow)"/>

  <!-- 4. Sacred Emblem Artwork with Shadow -->
  <g filter="url(#iconRelief)">
    <!-- Blooming Sacred Lotus (Padma) Base Petals -->
    <!-- Bottom central lotus pedestal -->
    <path d="M17 38.5 Q24 41 31 38.5 Q28 36.5 24 37 Q20 36.5 17 38.5 Z" fill="url(#goldGrad)"/>

    <!-- Left lower lotus petal -->
    <path d="M12 34 Q10 28 17 30 Q16 34 20 36.5 Q15 36.5 12 34 Z" fill="#d97706"/>
    <path d="M13.5 33 Q12 29 17 30.5 Q16.5 33.5 19.5 35.5 Q15.5 35 13.5 33 Z" fill="url(#goldGrad)"/>

    <!-- Right lower lotus petal -->
    <path d="M36 34 Q38 28 31 30 Q32 34 28 36.5 Q33 36.5 36 34 Z" fill="#d97706"/>
    <path d="M34.5 33 Q36 29 31 30.5 Q31.5 33.5 28.5 35.5 Q32.5 35 34.5 33 Z" fill="url(#goldGrad)"/>

    <!-- Classical Brass Diya (Deepa / Sacred Oil Lamp Bowl) -->
    <!-- Diya Stem & Base -->
    <path d="M22 34 L26 34 L25.5 36 L22.5 36 Z" fill="url(#goldGrad)"/>
    <!-- Diya Bowl Body -->
    <path d="M13 29 Q12.5 34 24 34 Q35.5 34 35 29 Q33 27.5 24 28 Q15 27.5 13 29 Z" fill="url(#goldGrad)"/>
    <!-- Diya Lip / Rim -->
    <ellipse cx="24" cy="28.5" rx="10.5" ry="1.8" fill="#fef08a" stroke="#b45309" stroke-width="0.5"/>
    <ellipse cx="24" cy="28.7" rx="8.5" ry="1.2" fill="#78350f"/>

    <!-- Sacred Kalasha / Peedam Center Detail -->
    <circle cx="24" cy="31.2" r="1.2" fill="#fef08a"/>

    <!-- Golden Diya Flame Wick Holder -->
    <path d="M23 28.5 L24 26 L25 28.5 Z" fill="#b45309"/>

    <!-- Radiant Jyoti (Sacred Flame) -->
    <!-- Outer Warm Fire Aura -->
    <path d="M24 8 C20 16 18 21 20.5 25 C22 27 26 27 27.5 25 C30 21 28 16 24 8 Z" fill="url(#flameGrad)"/>
    <!-- Inner Radiant Core Flame -->
    <path d="M24 13 C22 17 21 20 22.5 23 C23.2 24.2 24.8 24.2 25.5 23 C27 20 26 17 24 13 Z" fill="#fffbeb"/>
    
    <!-- Auspicious Bindu (Pinnacle Ray) -->
    <circle cx="24" cy="6.5" r="1" fill="#fef08a"/>
  </g>
</svg>
