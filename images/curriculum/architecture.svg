<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0e1a"/>
      <stop offset="60%" stop-color="#140a12"/>
      <stop offset="100%" stop-color="#0a0509"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="stoneTier" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d1b32"/>
      <stop offset="50%" stop-color="#5a2749"/>
      <stop offset="100%" stop-color="#2a1122"/>
    </linearGradient>
    <radialGradient id="sanctumAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#140a12" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueprintGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="350" fill="url(#archBg)"/>

  <!-- Blueprint Grid Overlay -->
  <g opacity="0.12" stroke="#d97706" stroke-width="0.8">
    <line x1="50" y1="0" x2="50" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="250" y1="0" x2="250" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="350" y1="0" x2="350" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/>
    <line x1="500" y1="0" x2="500" y2="350"/>
    <line x1="550" y1="0" x2="550" y2="350"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <!-- Diagonal Axis Lines -->
    <line x1="300" y1="20" x2="120" y2="320" stroke-dasharray="4,4"/>
    <line x1="300" y1="20" x2="480" y2="320" stroke-dasharray="4,4"/>
  </g>

  <!-- Sacred Sanctum Radiant Core -->
  <circle cx="210" cy="245" r="55" fill="url(#sanctumAura)"/>

  <!-- Plinth (Jagati) -->
  <rect x="70" y="300" width="460" height="24" rx="3" fill="#24101e" stroke="#e5a93b" stroke-width="1.5"/>
  <rect x="90" y="285" width="420" height="15" fill="#321429" stroke="#b45309" stroke-width="1"/>

  <!-- Garbha Griha & Shikhara (Curvilinear Spire) -->
  <!-- Main Sanctum Tower Tiers -->
  <path d="M 150 285 L 150 210 Q 155 120 200 65 Q 210 50 210 38 Q 210 50 220 65 Q 265 120 270 210 L 270 285 Z" fill="url(#stoneTier)" stroke="#e5a93b" stroke-width="2"/>
  
  <!-- Architectural Ribs (Urushringas) -->
  <path d="M 165 285 Q 170 170 200 100 Q 210 88 210 80 Q 210 88 220 100 Q 250 170 255 285" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.85"/>
  <path d="M 180 285 Q 185 200 205 130 L 215 130 Q 235 200 240 285" fill="none" stroke="#d97706" stroke-width="1" opacity="0.7"/>

  <!-- Horizontal Bhumi Moldings -->
  <line x1="162" y1="180" x2="258" y2="180" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="172" y1="145" x2="248" y2="145" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="184" y1="110" x2="236" y2="110" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="195" y1="80" x2="225" y2="80" stroke="#f59e0b" stroke-width="1.2"/>

  <!-- Amalaka (Ribbed Stone Disk) -->
  <ellipse cx="210" cy="35" rx="22" ry="7" fill="#d97706" stroke="#fef08a" stroke-width="1.5"/>
  <!-- Kalasha & Dhvaja (Finial & Sacred Flag) -->
  <path d="M 205 32 Q 210 20 210 12 Q 210 20 215 32 Z" fill="url(#goldGlow)" stroke="#fff" stroke-width="1"/>
  <circle cx="210" cy="11" r="3.5" fill="#fde047"/>
  <!-- Flag staff & flutter -->
  <line x1="210" y1="11" x2="210" y2="2" stroke="#e5a93b" stroke-width="1.5"/>
  <path d="M 210 3 L 232 8 L 210 14 Z" fill="#ea580c"/>

  <!-- Antarala (Vestibule Roof) -->
  <path d="M 270 285 L 270 215 L 305 185 L 340 215 L 340 285 Z" fill="#2d1326" stroke="#e5a93b" stroke-width="1.5"/>
  <!-- Mandapa Pyramidal Superstructure (Phamsana) -->
  <path d="M 330 285 L 330 220 L 390 140 L 450 220 L 450 285 Z" fill="url(#stoneTier)" stroke="#e5a93b" stroke-width="1.8"/>
  <path d="M 350 220 L 390 170 L 430 220" fill="none" stroke="#d97706" stroke-width="1.2"/>
  <!-- Mandapa Kalasha -->
  <path d="M 387 140 L 390 130 L 393 140 Z" fill="url(#goldGlow)"/>

  <!-- Inner Sanctum Doorway & Diya Light -->
  <rect x="192" y="235" width="36" height="50" rx="3" fill="#0d040a" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 192 235 Q 210 222 228 235" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <!-- Sacred Diya flame -->
  <path d="M 208 268 Q 210 258 210 254 Q 210 258 212 268 Z" fill="#fde047" filter="url(#blueprintGlow)"/>
  <ellipse cx="210" cy="270" rx="5" ry="2" fill="#b45309"/>

  <!-- Mandapa Pillars -->
  <rect x="350" y="230" width="8" height="55" fill="#58244e" stroke="#d97706" stroke-width="0.8"/>
  <rect x="386" y="230" width="8" height="55" fill="#58244e" stroke="#d97706" stroke-width="0.8"/>
  <rect x="422" y="230" width="8" height="55" fill="#58244e" stroke="#d97706" stroke-width="0.8"/>

  <!-- Callout Nodes & Measurement Lines -->
  <g stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,3">
    <line x1="210" y1="20" x2="100" y2="25"/>
    <line x1="210" y1="120" x2="80" y2="120"/>
    <line x1="210" y1="260" x2="80" y2="260"/>
    <line x1="390" y1="190" x2="520" y2="190"/>
    <line x1="480" y1="305" x2="550" y2="305"/>
  </g>
  <circle cx="210" cy="20" r="4" fill="#fbbf24"/>
  <circle cx="210" cy="120" r="4" fill="#fbbf24"/>
  <circle cx="210" cy="260" r="4" fill="#fbbf24"/>
  <circle cx="390" cy="190" r="4" fill="#fbbf24"/>
  <circle cx="480" cy="305" r="4" fill="#fbbf24"/>

  <!-- Callout Labels -->
  <text x="95" y="28" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">KALASHA (Spiritual Antenna)</text>
  <text x="75" y="124" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">SHIKHARA (Mount Meru Spire)</text>
  <text x="75" y="264" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">GARBHA GRIHA (Sanctum Core)</text>
  <text x="525" y="194" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">MANDAPA (Assembly Hall)</text>
  <text x="555" y="309" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="start">JAGATI (Sacred Plinth)</text>
</svg>
